server {
  listen 80;
  root /usr/share/nginx/html;

  # The core resolves the tenant from the Host header, so pass the browser's host through unchanged.
  location /api/ {
    proxy_pass http://core:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health/ {
    proxy_pass http://core:3000;
    proxy_set_header Host $host;
  }

  # Client-side routes (/m/today, /crm/leads, /console/...) all load the single-page app.
  location / {
    try_files $uri /index.html;
  }
}
